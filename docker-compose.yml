services:
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-api-service:1.0.0
    container_name: ocr-api
    command: ["ocr-api"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_JSON: "true"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      API_KEYS: "${API_KEYS:-}"
      OCR_LANGUAGE: "${OCR_LANGUAGE:-tur}"
      OCR_WORKING_DPI: "${OCR_WORKING_DPI:-300}"
      OCR_FORCE: "${OCR_FORCE:-false}"
      PDF_A_PROFILE: "${PDF_A_PROFILE:-PDF/A-2b}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-500}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-10}"
      MAX_QUEUE_DEPTH: "${MAX_QUEUE_DEPTH:-500}"
      MAX_PACKAGE_ENTRIES: "${MAX_PACKAGE_ENTRIES:-100000}"
      MAX_DISK_USAGE_GB: "${MAX_DISK_USAGE_GB:-50}"
      TEMP_STORAGE_PATH: "/data/ocr"
      CDN_BASE_URL: "${CDN_BASE_URL:-}"
      CDN_VERIFICATION_ID: "${CDN_VERIFICATION_ID:-}"
      CALLBACK_HMAC_SECRET: "${CALLBACK_HMAC_SECRET:-}"
      CALLBACK_ALLOWED_PREFIXES: "${CALLBACK_ALLOWED_PREFIXES:-}"
    volumes:
      - ocr_shared_data:/data/ocr
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  ocr-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-api-service:1.0.0
    container_name: ocr-worker
    command: ["ocr-worker"]
    environment:
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_JSON: "true"
      OCR_LANGUAGE: "${OCR_LANGUAGE:-tur}"
      WORKER_JOB_TYPES: "ocr"
      OCR_WORKER_COUNT: "${OCR_WORKER_COUNT:-10}"
      OCR_THREADS_PER_WORKER: "${OCR_THREADS_PER_WORKER:-1}"
      OCR_WORKING_DPI: "${OCR_WORKING_DPI:-300}"
      OCR_FORCE: "${OCR_FORCE:-false}"
      JOB_MAX_RETRIES: "${JOB_MAX_RETRIES:-2}"
      JOB_TIMEOUT_SECONDS: "${JOB_TIMEOUT_SECONDS:-1800}"
      RESULT_RETENTION_HOURS: "${RESULT_RETENTION_HOURS:-24}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-10}"
      TEMP_STORAGE_PATH: "/data/ocr"
      PDF_A_PROFILE: "${PDF_A_PROFILE:-PDF/A-2b}"
      PRESERVE_SOURCE_IMAGES: "true"
      DESKEW_WORKING_IMAGE: "true"
      CDN_BASE_URL: "${CDN_BASE_URL:-}"
      CDN_VERIFICATION_ID: "${CDN_VERIFICATION_ID:-}"
      CDN_VERIFY_TLS: "${CDN_VERIFY_TLS:-true}"
      CALLBACK_HMAC_SECRET: "${CALLBACK_HMAC_SECRET:-}"
      CALLBACK_ALLOWED_PREFIXES: "${CALLBACK_ALLOWED_PREFIXES:-}"
      CALLBACK_VERIFY_TLS: "${CALLBACK_VERIFY_TLS:-true}"
    volumes:
      - ocr_shared_data:/data/ocr
    read_only: true
    tmpfs:
      - /tmp:size=2G,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: unless-stopped
    depends_on:
      ocr-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "12.0"
          memory: 32G

  # Zip packaging runs in its own small pool so it never competes with OCR for CPU,
  # and OCR backlogs never delay a package a user is waiting for.
  package-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-api-service:1.0.0
    container_name: package-worker
    command: ["ocr-worker"]
    environment:
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_JSON: "true"
      WORKER_JOB_TYPES: "package"
      OCR_WORKER_COUNT: "${PACKAGE_WORKER_COUNT:-1}"
      MAX_CONCURRENT_PACKAGE_JOBS: "${MAX_CONCURRENT_PACKAGE_JOBS:-1}"
      PACKAGE_RETENTION_HOURS: "${PACKAGE_RETENTION_HOURS:-168}"
      PACKAGE_JOB_TIMEOUT_SECONDS: "${PACKAGE_JOB_TIMEOUT_SECONDS:-21600}"
      MAX_PACKAGE_FILE_MB: "${MAX_PACKAGE_FILE_MB:-2048}"
      JOB_MAX_RETRIES: "${JOB_MAX_RETRIES:-2}"
      TEMP_STORAGE_PATH: "/data/ocr"
      MAX_DISK_USAGE_GB: "${MAX_DISK_USAGE_GB:-50}"
      CDN_BASE_URL: "${CDN_BASE_URL:-}"
      CDN_VERIFICATION_ID: "${CDN_VERIFICATION_ID:-}"
      CDN_VERIFY_TLS: "${CDN_VERIFY_TLS:-true}"
      CALLBACK_HMAC_SECRET: "${CALLBACK_HMAC_SECRET:-}"
      CALLBACK_ALLOWED_PREFIXES: "${CALLBACK_ALLOWED_PREFIXES:-}"
      CALLBACK_VERIFY_TLS: "${CALLBACK_VERIFY_TLS:-true}"
    volumes:
      - ocr_shared_data:/data/ocr
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: unless-stopped
    depends_on:
      ocr-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  ocr_shared_data:
    driver: local
